name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://schoolops:schoolops@localhost:5432/schoolops
      TEST_DATABASE_URL: postgresql+asyncpg://schoolops:schoolops@localhost:5432/schoolops_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: schoolops
          POSTGRES_USER: schoolops
          POSTGRES_PASSWORD: schoolops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolops -d schoolops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
