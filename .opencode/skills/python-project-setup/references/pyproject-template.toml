# Baseline pyproject.toml for a src-layout Python 3.14 project using uv.
# Keep only the sections the project needs; delete examples that do not apply.

[project]
name = "package-name"
version = "0.1.0"
description = "What this package does."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = []

[project.optional-dependencies]
# Use extras only for genuinely optional runtime features.
# dev dependencies live in [dependency-groups] for uv.
postgres = ["asyncpg>=0.30"]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/package_name"]

# ---------------------------------------------------------------------------
# Ruff: one tool for formatting and linting.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "C4",     # comprehensions
    "PIE",    # misc lints
    "RET",    # return statements
    "ARG",    # unused arguments
    "PTH",    # pathlib
    "PERF",   # performance
    "FURB",   # refurb
    "PL",     # pylint subset
    "TRY",    # exception handling
    "EM",     # exception messages
    "LOG",    # logging
    "G",      # logging format
    "TID",    # import hygiene
    "S",      # bandit security
    "ASYNC",  # async correctness
    "PT",     # pytest style
    "RUF",    # ruff-specific
]
ignore = [
    "PLR0913", # too many arguments: sometimes a real design smell, often unavoidable
    "TRY003",  # long messages outside exception class: acceptable for context
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["package_name"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Type checking. Use mypy or pyright, not both in CI.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Example third-party override. Prefer installing stubs; ignore narrowly.
# [[tool.mypy.overrides]]
# module = ["some_untyped_lib.*"]
# ignore_missing_imports = true

# Pyright alternative:
# [tool.pyright]
# include = ["src", "tests"]
# typeCheckingMode = "strict"
# pythonVersion = "3.14"

# ---------------------------------------------------------------------------
# Tests and coverage.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "slow: tests that take more than a second",
    "integration: tests requiring external services",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/package_name/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------------------
# Optional: build backend for a CLI entry point.
# ---------------------------------------------------------------------------
# [project.scripts]
# package-name = "package_name.cli:main"
