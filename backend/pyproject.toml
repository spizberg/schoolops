[project]
name = "schoolops-api"
version = "0.1.0"
description = "School operations API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi[standard]>=0.115",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-W error"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*"]
ignore_missing_imports = true
